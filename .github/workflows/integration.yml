name: integration

on:
  pull_request:

jobs:
  integration:
    name: Integration (PHP ${{ matrix.php }}, WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # Lowest version allowed by composer.json, and the latest release.
        wordpress: ['6.7', 'latest']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring
          tools: composer:v2
          coverage: none

      - name: Use the lowest WordPress version
        if: matrix.wordpress != 'latest'
        run: >
          composer require --dev --no-update
          "roots/wordpress:~${{ matrix.wordpress }}.0"
          "wp-phpunit/wp-phpunit:~${{ matrix.wordpress }}.0"

      - run: composer install --no-progress --prefer-dist
      - run: composer test:wordpress
